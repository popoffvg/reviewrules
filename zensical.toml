[project]
site_name = "reviewrules"
site_url = "https://popoffvg.github.io/reviewrules/docs/"
repo_url = "https://github.com/popoffvg/reviewrules"
site_dir = ".tmp/pages/docs"
use_directory_urls = false
extra_css = ["stylesheets/docs.css"]
exclude_docs = """
/comparison.md
/comparison/
"""
nav = [
  { "Start here" = [
    { "Getting started" = "index.md" },
    { "Install reviewrules" = "installation.md" },
    { "Run from a coding agent" = "coding-agents.md" },
    { "Run in CI" = "ci.md" },
  ] },
  { "Review rules" = [
    { "Write rules" = "writing-rules.md" },
    { "Share rule sets" = "rule-sets.md" },
    { "Read review results" = "review-results.md" },
  ] },
  { Backends = [
    { "Choose a backend" = "backends.md" },
    { "Set up LiteLLM" = "litellm.md" },
    { "Add an agent plugin" = "agent-plugins.md" },
  ] },
  { Reference = [
    { "CLI commands" = "cli.md" },
    { Configuration = "configuration.md" },
    { "How a review works" = "how-a-run-works.md" },
    { "Agent plugin protocol" = "agent-plugin-protocol.md" },
    { Troubleshooting = "troubleshooting.md" },
  ] },
]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
variant = "modern"
font = false
features = [
  "navigation.sections",
  "navigation.expand",
  "navigation.footer",
  "toc.follow",
  "content.code.copy",
]

[project.theme.icon]
logo = "lucide/git-pull-request"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
