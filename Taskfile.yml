version: "3"

# A GOROOT from the shell points at another Go and breaks the toolchain switch in go.mod.
env:
  GOROOT: ""

tasks:
  setup:
    desc: Install the tools from mise.toml and the pre-push hook
    cmds:
      - mise install
      - task: hooks

  hooks:
    desc: Install a git pre-push hook that runs `task check`
    cmds:
      - |
        hook="$(git rev-parse --git-dir)/hooks/pre-push"
        cat > "$hook" <<'HOOK'
        #!/bin/sh
        PATH="$(mise bin-paths | paste -sd: -):$PATH" exec task check
        HOOK
        chmod +x "$hook"
        echo "installed $hook"

  generate:
    desc: Write the README Flags table and the docs/configuration.md Config keys table
    cmds:
      - go generate ./...

  build:
    desc: Build every package
    cmds:
      - go build ./...

  test:
    desc: Tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  lint:
    desc: golangci-lint (gosec, revive, ruleguard), then a gosec-only pass
    cmds:
      - go tool golangci-lint run ./...
      - go tool golangci-lint run --enable-only gosec ./...

  workflows:
    desc: actionlint and zizmor on the GitHub workflows
    cmds:
      - actionlint
      - zizmor --offline .github/workflows

  check:
    desc: Everything CI runs, in CI order
    cmds:
      - task: generate
      - task: build
      - task: test
      - task: lint
      - task: workflows

  install:
    desc: Install reviewrules into $(go env GOPATH)/bin
    cmds:
      - go install .

  live:
    desc: pi and opencode plugin tests against the real CLIs; REVIEWRULES_PI_MODEL and REVIEWRULES_OPENCODE_MODEL pick the models
    env:
      REVIEWRULES_PI_LIVE: "1"
      REVIEWRULES_OPENCODE_LIVE: "1"
      REVIEWRULES_PI_MODEL: '{{.REVIEWRULES_PI_MODEL | default ""}}'
      REVIEWRULES_OPENCODE_MODEL: '{{.REVIEWRULES_OPENCODE_MODEL | default ""}}'
    cmds:
      - go test -count=1 -run Live -v ./plugins/pi/ ./plugins/opencode/
